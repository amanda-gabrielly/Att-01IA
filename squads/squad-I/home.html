<!--
=========================================================
ARQUIVO: home.html
SQUAD: I
OBJETIVO: Página inicial apresentando os integrantes do Squad I.
REFATORAÇÃO APLICADA:
- Clean Code (Semântica): Padronização do menu de navegação (<nav>) usando listas (<ul> e <li>) para manter consistência com as outras páginas do projeto. Envolvimento do miolo em <main>.
- Clean Code (Conteúdo): Substituição das divs dos cards por <article>, já que cada perfil de integrante é uma entidade independente.
- Otimização (Acessibilidade & SEO): Adição de meta description, atributos aria-current no menu e melhoria nos textos alternativos das imagens (alt).
=========================================================
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Otimização [SEO]: Descrição da página para motores de busca -->
    <meta name="description" content="Conheça os integrantes do Squad I: Mariane, Camila, Evelyn e Ana Carolina.">
    
    <title>Home - Squad I</title>
    <link rel="stylesheet" href="styles/home.css">
</head>
<body>
    
    <!-- CABEÇALHO E NAVEGAÇÃO -->
    <header>
        <div class="logo-container">
            <h1>SQUAD <span>I</span></h1>
        </div>

        <!-- Clean Code: Padronizado com lista para evitar quebra de layout -->
        <nav class="menu" aria-label="Navegação Principal">
            <ul>
                <!-- Otimização [Acessibilidade]: aria-current indica a página atual -->
                <li><a href="home.html" class="ativo" aria-current="page">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="habilidades.html">Habilidades</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="depoimentos.html">Depoimentos</a></li>
                <li><a href="case-de-sucesso.html">Sucessos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section class="pessoas" aria-label="Integrantes do Squad I">

            <!-- Clean Code: <article> para representar cada perfil de integrante -->
            <article class="card">
                <img src="img/mariane.jpg" alt="Foto de perfil de Mariane Caldeira">
                <h3>Mariane Caldeira</h3>
                <p class="idade">23 anos</p>
            </article>

            <article class="card">
                <img src="img/catarina.jpg" alt="Foto de perfil de Camila Catarina">
                <h3>Camila Catarina</h3>
                <p class="idade">22 anos</p>
            </article>

            <article class="card">
                <img src="img/evelyn.jpg" alt="Foto de perfil de Evelyn Santos">
                <h3>Evelyn Santos</h3>
                <p class="idade">25 anos</p>
            </article>

            <article class="card">
                <img src="img/carol.jpg" alt="Foto de perfil de Ana Carolina">
                <h3>Ana Carolina</h3>
                <p class="idade">20 anos</p>
            </article>

        </section>
    </main>

</body>
</html>
