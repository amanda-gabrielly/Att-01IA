<!--
  Arquivo: contato.html | Squad E
  Objetivo: apresentar o formulario de contato e a localizacao da equipe.
  Refatoracoes: semantica HTML5, acessibilidade dos campos, SEO basico,
  correcao de atributos e integracao com estilos responsivos.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Entre em contato com o Squad E para conversar sobre projetos digitais." />
  <title>Contato - Squad E</title>
  <link rel="stylesheet" href="styles/contato.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="home.html">Squad E</a>
      <nav aria-label="Navegação principal">
        <a href="home.html">Home</a>
        <a href="servicos.html">Serviços</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html" aria-current="page">Contato</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Vamos conversar</p>
      <h1 id="page-title">Entre em contato</h1>
      <p>Conte um pouco sobre o seu projeto. Nossa equipe retornará em breve.</p>
    </section>

    <div class="contact-grid">
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Envie uma mensagem</h2>
        <form action="#" method="post">
          <div class="field">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="telefone">Telefone <span>(opcional)</span></label>
            <input type="tel" id="telefone" name="telefone" autocomplete="tel" />
          </div>

          <div class="field">
            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto" required>
              <option value="">Selecione uma opção</option>
              <option value="instagram">Instagram</option>
              <option value="github">GitHub</option>
              <option value="linkedin">LinkedIn</option>
            </select>
          </div>

          <div class="field">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
          </div>

          <button type="submit">Enviar mensagem</button>
        </form>
      </section>

      <section class="panel location" aria-labelledby="location-title">
        <h2 id="location-title">Localização</h2>
        <p>Faculdade Imaculada Conceição do Recife</p>
        <iframe
          src="https://www.google.com/maps?q=FICR+Recife&output=embed"
          title="Mapa da localização da FICR em Recife"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </section>
    </div>
  </main>
</body>
</html>
